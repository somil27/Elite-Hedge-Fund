[alembic]
script_location = db
version_locations = db/versions
# NOTE: This URL is overridden by DATABASE_URL_SYNC in .env via db/env.py
# The actual URL used is always read from settings, not from here.
sqlalchemy.url = postgresql://trader:trader_pass@postgres:5432/trading_system

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
